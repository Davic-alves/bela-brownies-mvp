<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Bela Brownies{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind via CDN: simples para o MVP; para produção, compile o CSS -->

  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="min-h-screen">

</body>
</html>
