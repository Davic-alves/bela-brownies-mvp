{% extends "base.html" %}
{% block titulo %}Entrar · Bela Brownies{% endblock %}
{% block conteudo %}
<h1 class="text-3xl mb-1">Bela Brownies</h1>
<p class="mb-6">Entre para ver pedidos e estoque.</p>
{% if erro %}<p class="aviso-erro mb-4" role="alert">⚠ {{ erro }}</p>{% endif %}
<form method="post" action="/login" class="space-y-4">
  <div><label class="rotulo" for="usuario">Usuário</label>
    <input class="campo" id="usuario" name="usuario" autocomplete="username" required></div>
  <div><label class="rotulo" for="senha">Senha</label>
    <input class="campo" id="senha" name="senha" type="password" autocomplete="current-password" required></div>
  <button class="btn w-full" type="submit">Entrar</button>
</form>
{% endblock %}
